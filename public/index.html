<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>8 Ball Pool - Multiplayer Billiards Arena</title>
  <meta name="description" content="Mobile-first 8 Ball Pool multiplayer game with playable physics, rooms, matchmaking, invitations, virtual coin ledger, and admin management.">
  <link rel="icon" type="image/jpeg" href="/public/img_app_icon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #040e0a;
      --bg-card: #0d1d16;
      --bg-card-border: #163626;
      --felt-green: #094e2e;
      --felt-bright: #0e693f;
      --gold: #ffd54f;
      --gold-dark: #c5a059;
      --emerald: #10b981;
      --emerald-dark: #064e3b;
      --loss-red: #ef4444;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --wood-rail: #4a2810;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 10%, #0d2e20 0%, #040e0a 80%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: stretch;
      overflow-x: hidden;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #06150f;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
      border-left: 1px solid rgba(255, 255, 255, 0.05);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    .view-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      padding-bottom: 84px;
      overflow-y: auto;
    }

    .no-bottom-pad {
      padding-bottom: 16px;
    }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--bg-card-border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .card-gold {
      border-color: rgba(255, 213, 79, 0.4);
    }

    /* Typography */
    h1, h2, h3, h4 {
      color: var(--text-primary);
      font-weight: 800;
    }

    .gold-title {
      color: var(--gold);
      letter-spacing: 1.5px;
      text-shadow: 0 2px 8px rgba(255, 213, 79, 0.2);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      font-size: 14px;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-gold {
      background: var(--gold);
      color: #120c00;
      box-shadow: 0 4px 14px rgba(255, 213, 79, 0.3);
    }

    .btn-emerald {
      background: var(--felt-bright);
      color: #fff;
    }

    .btn-dark {
      background: #153123;
      color: var(--gold);
      border: 1px solid var(--bg-card-border);
    }

    .btn-danger {
      background: var(--loss-red);
      color: white;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 8px;
    }

    .btn-block {
      width: 100%;
    }

    /* Chips & Badges */
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      background: #11281e;
      border: 1px solid var(--bg-card-border);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip.active {
      background: var(--gold);
      color: #0b0f0c;
      border-color: var(--gold);
    }

    .coin-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #132a20;
      border: 1.5px solid var(--gold);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 800;
      color: var(--gold);
    }

    /* Avatars */
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: white;
      border: 2px solid var(--gold);
      position: relative;
      flex-shrink: 0;
    }

    .avatar-sm { width: 36px; height: 36px; font-size: 12px; }
    .avatar-lg { width: 64px; height: 64px; font-size: 22px; }

    .online-indicator {
      width: 12px;
      height: 12px;
      background: var(--emerald);
      border: 2px solid #06150f;
      border-radius: 50%;
      position: absolute;
      bottom: -1px;
      right: -1px;
    }

    .online-indicator.offline {
      background: #6b7280;
    }

    /* Inputs */
    .input-field {
      width: 100%;
      background: #091711;
      border: 1px solid var(--bg-card-border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 12px;
    }

    .input-field:focus {
      border-color: var(--gold);
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: #0b1a13;
      border-top: 1px solid var(--bg-card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: color 0.15s;
    }

    .nav-item.active {
      color: var(--gold);
    }

    .nav-icon {
      font-size: 20px;
    }

    /* Modals & Dialogs */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-card {
      width: 100%;
      max-width: 400px;
      background: #0e2219;
      border: 1px solid var(--gold);
      border-radius: 20px;
      padding: 20px;
      animation: popIn 0.2s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* Pool Canvas */
    #canvas-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      touch-action: none;
    }

    #pool-canvas {
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9), inset 0 0 15px rgba(0,0,0,0.8);
      cursor: crosshair;
    }

    /* Toast */
    #toast {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-60px);
      background: #143525;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      z-index: 200;
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
      pointer-events: none;
      text-align: center;
      max-width: 88%;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="toast">Message</div>
    <div id="main-view" class="view-content"></div>
    <nav id="bottom-bar" class="bottom-nav" style="display: none;">
      <div class="nav-item" data-route="/play">
        <span class="nav-icon">🎱</span>
        <span>Play</span>
      </div>
      <div class="nav-item" data-route="/leaderboard">
        <span class="nav-icon">🏆</span>
        <span>Ranks</span>
      </div>
      <div class="nav-item" data-route="/history">
        <span class="nav-icon">📜</span>
        <span>Matches</span>
      </div>
      <div class="nav-item" data-route="/profile">
        <span class="nav-icon">👤</span>
        <span>Profile</span>
      </div>
    </nav>
  </div>

    <!-- Modular Scripts -->
  <script src="/js/db.js"></script>
  <script>
    // Initialize Database on startup
    initDatabase();
  </script>
  <script src="/js/pwa.js"></script>
  <script src="/js/game.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
